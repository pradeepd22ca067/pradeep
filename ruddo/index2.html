<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruddo Registration</title>
    <link rel="stylesheet" href="stylet.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="welcome-title">
        <p class="eyebrow">Join our community</p>
        <h1 id="welcome-title">Welcome To Ruddo</h1>
        <p class="subtitle">
          For more information, connect with me on
          <a href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>.
        </p>
      </section>

      <section class="form-card" aria-labelledby="registration-title">
        <h2 id="registration-title">Register Now</h2>

        <form class="registration-form" action="register.php" method="post" enctype="multipart/form-data">
          <div class="form-row">
            <div class="field">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first_name" required />
            </div>

            <div class="field">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last_name" required />
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" required />
          </div>

          <div class="form-row">
            <div class="field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required />
            </div>

            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required />
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="pincode">Pin Code</label>
              <input type="text" id="pincode" name="pincode" required />
            </div>

            <div class="field">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required />
            </div>
          </div>

          <div class="field file-field">
            <label for="cv">Upload CV</label>
            <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" />
          </div>

          <button type="submit">Register</button>
        </form>
      </section>
    </main>
  </body>
</html>
